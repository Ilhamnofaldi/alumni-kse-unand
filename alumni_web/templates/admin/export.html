{% extends "base.html" %}
{% block title %}Ekspor data · Pengurus{% endblock %}
{% block content %}
<p class="crumb"><a href="{{ url_for('admin_home') }}">← Panel pengurus</a></p>
<section class="page-head">
  <h1>Unduh data lengkap</h1>
  <p>Berkas ini berisi {{ total }} baris, termasuk WhatsApp, email, alamat, dan tanggal lahir. Jangan teruskan ke grup publik.</p>
</section>
<form method="post" class="stack" data-confirm="Unduh seluruh data termasuk kontak?">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <p class="toolbar">
    <button class="btn" type="submit">Unduh CSV</button>
    <a class="btn btn-ghost" href="{{ url_for('admin_home') }}">Batal</a>
  </p>
</form>
{% endblock %}
